[package]
name = "seed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# load:   stages, validates and inserts the three datasets
# verify: proves the result is complete and that vector search works
[[bin]]
name = "load"
path = "src/main.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dotenvy = "0.15"
pgvector = { version = "0.4", features = ["sqlx"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v5", "serde"] }
